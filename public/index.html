<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#b3202f;--deep:#8a1424;--green:#14573a;--gold:#e3bd6a;--cream:#fffaf0}
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{font:17px system-ui,sans-serif;max-width:660px;margin:0 auto;padding:0 1rem 150px;color:#f6efe0;min-height:100vh;
    background:radial-gradient(ellipse at 50% -10%,#2a8a5c 0%,#14573a 38%,#0b3a27 70%,#06241a 100%) fixed}
  #app{position:relative;z-index:2}
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700}
  header{text-align:center;margin:7.2rem 0 1.4rem;position:relative;z-index:2}
  h1{font-size:3.8rem;line-height:1;margin:0;color:#fff8e6;text-shadow:0 2px 0 #7a1522,0 0 24px rgba(255,210,122,.5)}
  .kicker{color:var(--gold);letter-spacing:.35em;font-size:.75rem;text-transform:uppercase;margin-top:.7rem}
  .holly{display:inline-block;width:64px;vertical-align:middle;margin:0 .2rem}
  h2{font-size:1.8rem;color:#ffe9b0;border-bottom:1px solid var(--gold);padding-bottom:.2rem;margin-top:1.8rem}
  p{line-height:1.45}
  a{color:#ffd98a}
  textarea,input,select,button{font:inherit;padding:.6rem;margin:.3rem 0;border-radius:10px;border:1px solid var(--gold)}
  textarea,input,select{background:var(--cream);color:#2a2622}
  textarea,input.wide{width:100%}
  button,a.btn{background:linear-gradient(#cf2c3e,var(--deep));color:#fff;cursor:pointer;text-decoration:none;display:inline-block;padding:.6rem .95rem;border-radius:10px;border:1px solid var(--gold);box-shadow:0 2px 6px #0005}
  button.alt,a.alt{background:var(--cream);color:var(--deep);border:1px solid var(--gold)}
  button:disabled{opacity:.6}
  .card{display:flex;gap:.8rem;background:var(--cream);color:#2a2622;border-radius:12px;padding:.8rem;margin:.6rem 0;border:1px solid var(--gold);box-shadow:0 3px 10px #0004}
  .card img{width:80px;height:80px;object-fit:contain;flex:none}
  .card p{margin:.2rem 0;font-size:.88rem;color:#555}
  .card b{display:block}
  .card .muted{color:#666}
  .spin{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.2rem;text-align:center;padding:1.5rem;background:var(--cream);color:var(--green);border-radius:14px;margin:1rem 0;border:2px solid var(--gold);box-shadow:0 4px 14px #0005}
  .spin button{font-family:system-ui,sans-serif;font-size:1rem}
  .over,.err{color:#ffb3ba;font-weight:600}
  .muted{color:rgba(255,255,255,.72);font-size:.85rem}
  table{width:100%;border-collapse:collapse} td{vertical-align:top;border-top:1px solid rgba(255,255,255,.2);padding:.6rem .3rem}
  dialog{background:var(--cream);color:#2a2622}
  dialog .muted{color:#666}
  .pills{display:flex;flex-wrap:wrap;gap:.45rem;margin:.4rem 0}
  .pill{background:var(--cream);color:#2a2622;border:1px solid var(--gold);border-radius:999px;padding:.3rem .85rem;font-size:.95rem;box-shadow:0 2px 5px #0004;user-select:none}
  .pill[data-pick],.pill[data-partner]{cursor:pointer}
  .pill.sel{background:linear-gradient(#cf2c3e,var(--deep));color:#fff}
  .pill.used{opacity:.5;cursor:default}
  .pill.couple{background:#ffe9b0}
  .pill .x{margin-left:.35rem;opacity:.55;cursor:pointer;font-weight:700}
  .pill .x:hover{opacity:1}  .price{display:inline-block;background:var(--green);color:#fff;font-weight:700;font-size:1.2rem;line-height:1.2;padding:.15rem .75rem;border-radius:999px;margin:.15rem 0 .3rem}
  .price.big{font-size:1.7rem;padding:.2rem 1rem}
  .noprice{color:#b45f06;font-weight:700;font-size:1.3rem}
  .nohint{color:#b45f06;font-weight:700;font-size:1.05rem;margin:.3rem 0}
  .total{font-size:1.25rem}
  input.need{border:2px solid var(--red);box-shadow:0 0 0 4px rgba(207,44,62,.25)}  #more{position:fixed;top:12px;left:12px;z-index:10;border-radius:999px;font-size:.9rem}
  #tunes{position:fixed;bottom:12px;right:12px;width:min(340px,94vw);background:var(--cream);color:#2a2622;border:2px solid var(--gold);border-radius:14px;padding:.5rem;z-index:11;box-shadow:0 6px 24px #0007}
  #tunes .thead{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap} #tunes .tsp{flex:1}
  #tunes button{padding:.25rem .65rem;font-size:.82rem;margin:0;box-shadow:none}
  #tunes.min #tbody{height:0;overflow:hidden}
  #tunes button.on{background:var(--green);color:#fff}
  #tstat{font-size:.75rem;color:#9a6b00;font-weight:600}
  #tbody{margin-top:.4rem;border-radius:10px;overflow:hidden}
  button.del{background:transparent;color:#ffb3ba;border:1px solid rgba(255,179,186,.45);padding:.1rem .6rem;font-size:.78rem;box-shadow:none;margin-left:.5rem;border-radius:999px;opacity:.85}
  button.del:hover{background:rgba(179,32,47,.45);color:#fff;opacity:1}
  #tunes[hidden]{display:none}
  #tunes .muted{color:#666} #tunes a{color:var(--deep)}
  /* decorations */
  #garland{position:absolute;top:0;left:0;right:0;height:120px;pointer-events:none;z-index:1}
  #garland svg{display:block;width:100%;height:120px}
  .tree{position:fixed;bottom:0;width:250px;pointer-events:none;z-index:1;filter:drop-shadow(0 0 18px rgba(255,220,140,.25))}
  .tree.l{left:6px} .tree.r{right:6px;transform:scaleX(-1)}
  .tw{animation:tw 2.6s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}
  #snow{position:fixed;inset:0;pointer-events:none;z-index:6}
  #music{position:fixed;top:12px;right:12px;z-index:10;border-radius:999px;font-size:.9rem}
  @media (max-width:980px){.tree{width:92px}h1{font-size:2.8rem}}
  @media (prefers-reduced-motion:reduce){.tw{animation:none}}
</style>
</head>
<body>
<div id="garland"></div>
<canvas id="snow"></canvas>
<div class="tree l" id="treeL"></div><div class="tree r" id="treeR"></div>

<header><h1>Secret Santa</h1><div class="kicker"><svg class="holly" viewBox="0 0 64 40" aria-hidden="true"><g transform="translate(32 22)"><path d="M0 0C-6 -14 -24 -16 -30 -6C-24 -2 -26 4 -20 6C-16 10 -8 8 0 0Z" fill="#2a7a56" stroke="#0f3a28"/><path d="M0 0C6 -14 24 -16 30 -6C24 -2 26 4 20 6C16 10 8 8 0 0Z" fill="#3f9a70" stroke="#0f3a28"/><path d="M-26 -5L-2 -1M26 -5L2 -1" stroke="#0f3a28" stroke-width="1" fill="none"/><circle cx="-3" cy="2" r="5" fill="#d92b3d"/><circle cx="4" cy="3" r="5" fill="#b3202f"/><circle cx="0" cy="8" r="5" fill="#d92b3d"/><circle cx="-4.5" cy="0.5" r="1.3" fill="#ffd0d6"/><circle cx="2.5" cy="1.5" r="1.3" fill="#ffd0d6"/></g></svg> &nbsp;merry &amp; bright&nbsp; <svg class="holly" style="transform:scaleX(-1)" viewBox="0 0 64 40" aria-hidden="true"><g transform="translate(32 22)"><path d="M0 0C-6 -14 -24 -16 -30 -6C-24 -2 -26 4 -20 6C-16 10 -8 8 0 0Z" fill="#2a7a56" stroke="#0f3a28"/><path d="M0 0C6 -14 24 -16 30 -6C24 -2 26 4 20 6C16 10 8 8 0 0Z" fill="#3f9a70" stroke="#0f3a28"/><path d="M-26 -5L-2 -1M26 -5L2 -1" stroke="#0f3a28" stroke-width="1" fill="none"/><circle cx="-3" cy="2" r="5" fill="#d92b3d"/><circle cx="4" cy="3" r="5" fill="#b3202f"/><circle cx="0" cy="8" r="5" fill="#d92b3d"/><circle cx="-4.5" cy="0.5" r="1.3" fill="#ffd0d6"/><circle cx="2.5" cy="1.5" r="1.3" fill="#ffd0d6"/></g></svg></div></header>
<div id="app"></div>
<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const [, role, token] = location.pathname.split('/');

async function api(a, data, qs = '') {
  const r = await fetch(`/api?a=${a}${qs}`, data ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) } : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}
const ITEMS = [];
const card = (i, extra = '') => `<div class="card">${i.image ? `<img src="${esc(i.image)}" referrerpolicy="no-referrer" alt="">` : ''}
  <div><b>${esc(i.title)}</b><div>${i.price ? `<span class="price">R${esc(i.price)}</span>` : '<span class="noprice">No price yet</span>'}</div><button data-view="${ITEMS.push(i) - 1}">View</button> ${extra}</div></div>`;

// Item popup: native <dialog>, filled on demand.
document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg" style="max-width:480px;border-radius:12px;border:0;padding:1.2rem"></dialog>');
document.addEventListener('click', (e) => {
  const dlg = $('#dlg');
  if (e.target.dataset.view != null) {
    const i = ITEMS[e.target.dataset.view];
    dlg.innerHTML = `${i.image ? `<img src="${esc(i.image)}" referrerpolicy="no-referrer" alt="" style="width:100%;max-height:260px;object-fit:contain">` : ''}
      <h3>${esc(i.title)}</h3><p>${esc(i.description) || '<span class="muted">No description available.</span>'}</p>
      <p>${i.price ? `<span class="price big">R${esc(i.price)}</span>` : '<span class="noprice">No price yet</span>'}</p>
      <a class="btn" href="${esc(i.url)}" target="_blank" rel="noopener">Go to shop</a> <button class="alt" data-close>Close</button>`;
    dlg.showModal();
  } else if (e.target.dataset.close != null || e.target === dlg) dlg.close();
});

/* ---------- delete a game for good: three "are you sure" steps, then the server wipes it ---------- */
document.body.insertAdjacentHTML('beforeend', '<dialog id="cfm" style="max-width:420px;border-radius:12px;border:2px solid var(--gold);padding:1.3rem"></dialog>');
const ask = (title, body, yes, phrase) => new Promise((resolve) => {
  const d = $('#cfm');
  d.innerHTML = `<h3 style="margin-top:0">${title}</h3><p>${body}</p>${phrase ? `<input class="wide" id="cType" placeholder="Type: ${phrase}" autocomplete="off">` : ''}<button class="alt" id="cNo">No, keep it</button> <button id="cYes" ${phrase ? 'disabled' : ''}>${yes}</button>`;
  let done = false; const fin = (v) => { if (done) return; done = true; d.close(); resolve(v); };
  $('#cNo').onclick = () => fin(false); $('#cYes').onclick = () => fin(true); d.oncancel = () => fin(false);
  if (phrase) $('#cType').oninput = (e) => { $('#cYes').disabled = e.target.value.trim().replace(/[.!]+$/, '').replace(/\s+/g, ' ').toLowerCase() !== phrase.toLowerCase(); };
  d.showModal();
});
async function deleteGame(name, hostToken) {
  const n = `<b>${esc(name)}</b>`;
  if (!(await ask('Are you sure?', `Do you really want to delete ${n}?`, 'Yes'))) return;
  if (!(await ask('Have you double checked?', `Every player's link, the whole draw and all wish lists for ${n} will be gone.`, 'Yes, I checked'))) return;
  if (!(await ask('Are you REEEEEAALLYY Sure?', `This cannot be undone. ${n} will be deleted forever. To confirm, type <b>I am really sure</b> below.`, 'Yes, delete it forever', 'I am really sure'))) return;
  try { await api('delete', { t: hostToken }); } catch (e) { if (e.message !== 'Bad link') return alert(e.message); } // "Bad link" means it is already gone
  try { localStorage.games = JSON.stringify(JSON.parse(localStorage.games || '[]').filter((g) => g.host !== hostToken)); } catch {}
  location.href = '/';
}
/* ---------- home: host creates the game ---------- */
function home() {
  const games = JSON.parse(localStorage.games || '[]');
  let names = [], couples = [], sel = [];
  app.innerHTML = `${games.length ? `<h2>Your games</h2>${games.map((g) => `<p><a href="/h/${esc(g.host)}">${esc(g.title)}</a> <button class="del" data-del="${esc(g.host)}" data-title="${esc(g.title)}">Delete</button></p>`).join('')}<h2>Start a new game</h2>` : ''}
    <p>Group name (for example "Sarah's family"):</p>
    <input class="wide" id="title" placeholder="Sarah's family">
    <p>You're the host. Who's taking part? Type a name and press Enter.</p>
    <div class="pills" id="nameP"></div>
    <input class="wide" id="nameIn" placeholder="Type a name, then press Enter" autocomplete="off">
    <div id="coupleBox" hidden>
      <p>Couples: tap the people who must not draw each other, then link them.</p>
      <div class="pills" id="pickP"></div>
      <button type="button" class="alt" id="link" disabled>♥ Link as couple</button>
      <div class="pills" id="coupleP"></div>
    </div>
    <p><button id="go">Create game and draw</button> <span class="err" id="err"></span></p>`;
  const used = (n) => couples.some((c) => c.includes(n));
  const render = () => {
    $('#nameP').innerHTML = names.map((n) => `<span class="pill">${esc(n)} <b class="x" data-rm="${esc(n)}">×</b></span>`).join('');
    $('#coupleBox').hidden = names.length < 2;
    $('#pickP').innerHTML = names.map((n) => `<span class="pill${sel.includes(n) ? ' sel' : ''}${used(n) ? ' used' : ''}" data-pick="${esc(n)}">${esc(n)}${used(n) ? ' ♥' : ''}</span>`).join('');
    $('#link').disabled = sel.length < 2;
    $('#coupleP').innerHTML = couples.map((c, i) => `<span class="pill couple">${c.map(esc).join(' ♥ ')} <b class="x" data-uncouple="${i}">×</b></span>`).join('');
  };
  const add = (raw) => {
    for (const n of raw.split(/[,\n]/).map((s) => s.trim()).filter(Boolean)) if (!names.some((x) => x.toLowerCase() === n.toLowerCase())) names.push(n);
    $('#nameIn').value = ''; render();
  };
  $('#nameIn').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(e.target.value); } };
  $('#nameIn').onpaste = (e) => { e.preventDefault(); add(e.target.value + e.clipboardData.getData('text')); };
  app.onclick = (e) => {
    const d = e.target.dataset;
    if (d.del != null) { deleteGame(d.title, d.del); return; }
    if (d.rm != null) { names = names.filter((n) => n !== d.rm); sel = sel.filter((n) => n !== d.rm); couples = couples.map((c) => c.filter((n) => n !== d.rm)).filter((c) => c.length > 1); }
    if (d.pick != null && !used(d.pick)) sel = sel.includes(d.pick) ? sel.filter((n) => n !== d.pick) : [...sel, d.pick];
    if (d.uncouple != null) couples.splice(d.uncouple, 1);
    if (e.target.id === 'link' && sel.length > 1) { couples.push(sel); sel = []; }
    render();
  };
  $('#go').onclick = async () => {
    add($('#nameIn').value);
    try {
      const r = await api('create', { title: $('#title').value, names, couples });
      location.href = '/h/' + r.host;
    } catch (e) { $('#err').textContent = e.message; }
  };
  render();
}
/* ---------- host master view ---------- */
async function host() {
  const { title, players, budget } = await api('host', null, '&t=' + token);
  const origin = location.origin;
  const games = JSON.parse(localStorage.games || '[]').filter((g) => g.host !== token);
  localStorage.games = JSON.stringify([...games, { title, host: token }]);
  app.innerHTML = `<p><a href="/">All my games</a></p><h2>${esc(title)}</h2><p>Master view. Bookmark this page and keep it private. Send each person their own link (don't open them yourself if you want to stay surprised).</p>
    <table>${players.map((p) => `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${p.revealed ? 'has spun' : 'not spun yet'}</span><br>
      <button class="alt" data-link="${esc(origin + '/p/' + p.token)}">Copy link</button></td>
      <td><button class="alt" data-reveal>Reveal</button>
        <div hidden>gives to <b>${esc(p.gives)}</b><br>${p.items.length ? p.items.map((i) => `<div class="muted"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a> <b>${i.price ? 'R' + esc(i.price) : ''}</b></div>`).join('') : '<span class="muted">no wish list yet</span>'}</div></td></tr>`).join('')}</table>
    <p class="muted">Budget R${budget} each. Wish lists update when you refresh.</p>
    <h2>Add someone</h2>
    <input id="newname" placeholder="Name"> <p class="muted">Couple with (tap anyone they must not draw, optional):</p><div class="pills" id="partnerP">${players.map((p) => `<span class="pill" data-partner="${esc(p.name)}">${esc(p.name)}</span>`).join('')}</div>
    <button id="addp">Add</button> <span class="err" id="err"></span>
    <h2>Start over</h2>
    <button class="alt" id="redraw">Redraw everyone</button> <span class="muted">New draw, everyone spins again. Wish lists are kept.</span>
    <h2>Delete this game</h2>
    <button class="del" id="delgame" style="margin-left:0">Delete this game</button> <span class="muted">Removes it for everyone, for good.</span>`;
  const act = async (a, data) => { try { await api(a, { t: token, ...data }); host(); } catch (x) { $('#err').textContent = x.message; } };
  $('#addp').onclick = () => act('add', { name: $('#newname').value, partners: [...document.querySelectorAll('#partnerP .sel')].map((x) => x.dataset.partner) });
  $('#delgame').onclick = () => deleteGame(title, token);
  $('#redraw').onclick = () => confirm('Redraw everyone? Anyone who already spun will have a new person.') && act('redraw');
  app.onclick = (e) => {
    if (e.target.dataset.partner != null) e.target.classList.toggle('sel');
    if (e.target.dataset.reveal != null) { const d = e.target.nextElementSibling; d.hidden = !d.hidden; e.target.textContent = d.hidden ? 'Reveal' : 'Hide'; }
    const l = e.target.dataset.link; if (l) navigator.clipboard.writeText(l).then(() => (e.target.textContent = 'Copied!')); };
}

/* ---------- player view ---------- */
async function player() {
  let me = await api('me', null, '&t=' + token);
  const total = () => me.items.reduce((s, i) => s + (Number(i.price) || 0), 0);
  const save = () => api('items', { t: token, items: me.items });

  function render() {
    const t = total();
    ITEMS.length = 0;
    app.innerHTML = `<p>Hi <b>${esc(me.name)}</b>! <span class="muted">${esc(me.title)}</span></p>
      <div id="spin"></div>
      <h2>Your wish list</h2>
      <p class="muted">Pick up to ${me.maxItems} things worth about R${me.budget} in total (a little over or under is fine). Find them, then paste the product link here. Takealot fills in everything for you. For Amazon and Temu, just check the name and add the price.</p>
      <a class="btn alt" href="https://www.takealot.com" target="_blank" rel="noopener">Browse takealot.com</a>
      <a class="btn alt" href="https://www.amazon.co.za" target="_blank" rel="noopener">Browse amazon.co.za</a>
      <a class="btn alt" href="https://www.temu.com" target="_blank" rel="noopener">Browse temu.com</a>
      <p class="muted">Temu ships slowly, so only pick from Temu if you add your list at least a month before the gift swap.</p>
      <div><input class="wide" id="url" placeholder="Paste a takealot, amazon or temu product link"> <button id="add">Add item link</button> <span class="err" id="err"></span></div>
      ${me.items.map((i, n) => card(i, `<br><label class="muted">Gift name <input class="wide" value="${esc(i.title)}" data-title="${n}"></label>
        ${i.price ? '' : '<div class="nohint">Please enter the price yourself: type what you see on the shop\'s site, in Rand.</div>'}<label class="muted">Price in Rand <input class="${i.price ? '' : 'need'}" type="number" min="0" style="width:6rem" value="${esc(i.price || '')}" data-price="${n}" placeholder="e.g. 250"></label>
        <button class="alt" data-rm="${n}">Remove</button>
        <details><summary class="muted">${i.image ? 'Change photo' : 'Add a photo (optional)'}</summary>
          <label class="muted">Right-click the product photo, choose Copy image address, paste here <input class="wide" value="${esc(i.image)}" data-image="${n}" placeholder="https://..."></label>
        </details>`)).join('')}
      <p class="total">Total: <span class="${t > me.budget * 1.2 ? 'over' : ''}">R${t}</span> of R${me.budget}</p>
      <div id="target"></div>`;
    renderSpin();
    if (me.revealed) renderTarget();
  }

  function renderSpin() {
    $('#spin').innerHTML = me.revealed
      ? `<div class="spin">You are Secret Santa for<br><b>🎁 ${esc(me.target.name)}</b></div>`
      : `<div class="spin" id="wheel">Ready to find out who you got?<br><button id="spinbtn">🎲 Spin!</button></div>`;
    const b = $('#spinbtn');
    if (!b) return;
    b.onclick = async () => {
      b.disabled = true;
      const r = await api('reveal', { t: token });
      const w = $('#wheel'); let k = 0;
      const timer = setInterval(() => { w.textContent = me.names[k++ % me.names.length]; }, 90);
      setTimeout(() => { clearInterval(timer); me = r; render(); }, 3000);
    };
  }

  function renderTarget() {
    $('#target').innerHTML = `<h2>Gift ideas from ${esc(me.target.name)}</h2>` +
      (me.target.items.length ? me.target.items.map((i) => card(i)).join('') : '<p class="muted">They have not picked anything yet. Check back later (refresh the page).</p>');
  }

  app.onclick = async (e) => {
    const d = e.target.dataset;
    if (d.rm != null) { me.items.splice(d.rm, 1); await save(); render(); }
    if (e.target.id === 'add') {
      $('#err').textContent = '';
      if (me.items.length >= me.maxItems) return ($('#err').textContent = `Max ${me.maxItems} items`);
      e.target.disabled = true; e.target.textContent = 'Loading...';
      try { me.items.push(await api('preview', null, `&t=${token}&url=${encodeURIComponent($('#url').value.trim())}`)); await save(); render(); }
      catch (x) { $('#err').textContent = x.message; e.target.disabled = false; e.target.textContent = 'Add item link'; }
    }
  };
  app.onchange = async (e) => {
    const d = e.target.dataset;
    if (d.price != null) me.items[d.price].price = Number(e.target.value) || 0;
    else if (d.title != null) me.items[d.title].title = e.target.value.trim().slice(0, 200) || me.items[d.title].title;
    else if (d.image != null) me.items[d.image].image = e.target.value.trim();
    else return;
    await save(); render();
  };
  render();
}

(role === 'h' ? host() : role === 'p' ? player() : Promise.resolve(home())).catch((e) => (app.innerHTML = `<p class="err">${esc(e.message)}</p>`));
</script>
<script>
/* ---- Decorations: garland, trees, holly, snow, music box carols (same on every page) ---- */
(() => {
  const f = (n) => n.toFixed(1);
  const mk = (s0) => { let s = s0; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const LIGHTS = ['#fff6d6', '#ff7a7a', '#ffd27a', '#a8f0b4', '#ffffff'];
  const BAUBLES = [['#e8c86a', '#9a7424'], ['#d92b3d', '#7a0f1c'], ['#f4f4f4', '#aab4bd'], ['#c9a24a', '#8a6420']];

  // Pine garland across the top, sized to the window so it never crowds the title.
  function garland() {
    const rnd = mk(7), W = innerWidth, swags = Math.max(3, Math.round(W / 210)), sw = W / swags;
    let g = '', lights = '', top = '';
    for (let k = 0; k < swags; k++) {
      const x0 = k * sw, cx = x0 + sw / 2, x1 = x0 + sw;
      const pt = (t) => [(1 - t) ** 2 * x0 + 2 * (1 - t) * t * cx + t * t * x1, (1 - t) ** 2 * 8 + 2 * (1 - t) * t * 104 + t * t * 8];
      for (let t = 0; t <= 1; t += 6 / sw) {
        const [x, y] = pt(t);
        for (let n = 0; n < 4; n++) {
          const a = (rnd() * 150 + 15) * Math.PI / 180, l = 9 + rnd() * 12, d = rnd() < 0.5 ? -1 : 1;
          g += `<line x1="${f(x)}" y1="${f(y)}" x2="${f(x + Math.cos(a) * l * d)}" y2="${f(y + Math.sin(a) * l)}" stroke="${['#0f3a28', '#1b5b40', '#2a7a56', '#3f9a70'][n]}" stroke-width="2.6" stroke-linecap="round"/>`;
        }
        if (rnd() < 0.07) for (let b = 0; b < 3; b++) g += `<circle cx="${f(x + b * 5 - 5)}" cy="${f(y + 8 + (b % 2) * 4)}" r="3.4" fill="#d92b3d"/><circle cx="${f(x + b * 5 - 5.8)}" cy="${f(y + 7)}" r="1" fill="#ffd0d6"/>`;
      }
      for (let t = 0.06; t < 1; t += 0.09) {
        const [x, y] = pt(t), c = LIGHTS[Math.floor(rnd() * LIGHTS.length)];
        lights += `<g class="tw" style="animation-delay:${f(rnd() * 3)}s"><circle cx="${f(x)}" cy="${f(y + 10)}" r="10" fill="${c}" opacity=".3"/><circle cx="${f(x)}" cy="${f(y + 10)}" r="3.2" fill="${c}"/></g>`;
      }
    }
    for (let k = 0; k <= swags; k++) {
      const x = k * sw, y = 40 + (k % 2) * 14, [hi, lo] = BAUBLES[k % BAUBLES.length];
      top += `<line x1="${f(x)}" y1="8" x2="${f(x)}" y2="${y - 13}" stroke="#c9a24a" stroke-width="1.2"/><rect x="${f(x - 3.5)}" y="${y - 16}" width="7" height="5" rx="1" fill="#e3bd6a"/>
        <circle cx="${f(x)}" cy="${y}" r="13" fill="${lo}"/><circle cx="${f(x - 1.5)}" cy="${f(y - 1.5)}" r="11.5" fill="${hi}"/><ellipse cx="${f(x - 4.5)}" cy="${f(y - 5.5)}" rx="3.5" ry="2" fill="#fff" opacity=".6" transform="rotate(-35 ${f(x - 4.5)} ${f(y - 5.5)})"/>`;
    }
    document.getElementById('garland').innerHTML = `<svg viewBox="0 0 ${f(W)} 120" aria-hidden="true">${g}${lights}${top}</svg>`;
  }

  // A decorated Christmas tree with gold star, baubles, lights, tinsel and presents.
  function tree() {
    const rnd = mk(42);
    const tiers = [[20, 112, 52], [68, 172, 70], [118, 240, 88]]; // [apexY, baseY, half-width]
    let s = '<defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3fa06f"/><stop offset="1" stop-color="#0f4a30"/></linearGradient><radialGradient id="sg"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient></defs>';
    s += '<rect x="88" y="236" width="24" height="26" fill="#6b4226"/>';
    tiers.forEach(([a, b, hw]) => { s += `<path d="M100 ${a} L${100 + hw} ${b} Q100 ${b + 14} ${100 - hw} ${b} Z" fill="url(#tg)" stroke="#0b3a27" stroke-width="1.5"/>`; });
    tiers.forEach(([a, b, hw]) => { const y = b - 16; s += `<path d="M${100 - hw * 0.8} ${y} Q100 ${y + 26} ${100 + hw * 0.8} ${y}" fill="none" stroke="#e3bd6a" stroke-width="2.4" stroke-dasharray="1 5" stroke-linecap="round"/>`; });
    for (let i = 0; i < 26; i++) {
      const [a, b, hw] = tiers[Math.floor(rnd() * 3)], y = a + 24 + rnd() * (b - a - 34), w = hw * (y - a) / (b - a) * 0.82, x = 100 + (rnd() * 2 - 1) * w;
      if (i % 3 === 0) { const c = LIGHTS[Math.floor(rnd() * LIGHTS.length)]; s += `<g class="tw" style="animation-delay:${f(rnd() * 3)}s"><circle cx="${f(x)}" cy="${f(y)}" r="7" fill="${c}" opacity=".35"/><circle cx="${f(x)}" cy="${f(y)}" r="2.6" fill="${c}"/></g>`; }
      else { const [hi, lo] = BAUBLES[Math.floor(rnd() * BAUBLES.length)]; s += `<circle cx="${f(x)}" cy="${f(y)}" r="6.2" fill="${lo}"/><circle cx="${f(x - 0.6)}" cy="${f(y - 0.6)}" r="5.4" fill="${hi}"/><circle cx="${f(x - 2)}" cy="${f(y - 2.2)}" r="1.4" fill="#fff" opacity=".7"/>`; }
    }
    const star = [...Array(10)].map((_, i) => { const r = i % 2 ? 6 : 14, t = i * Math.PI / 5 - Math.PI / 2; return f(100 + r * Math.cos(t)) + ',' + f(18 + r * Math.sin(t)); }).join(' ');
    s += `<g class="tw"><circle cx="100" cy="18" r="30" fill="url(#sg)"/></g><polygon points="${star}" fill="#ffd24a" stroke="#c9961f" stroke-width="1"/>`;
    [[34, 12, '#b3202f', '#e3bd6a'], [62, 18, '#f4f4f4', '#b3202f'], [118, 14, '#e3bd6a', '#14573a'], [140, 10, '#b3202f', '#f4f4f4']].forEach(([x, w, c, r], i) => {
      const h = w + (i % 2) * 4;
      s += `<rect x="${x}" y="${290 - h}" width="${w + 12}" height="${h}" fill="${c}" stroke="#0004"/><rect x="${x + (w + 12) / 2 - 2}" y="${290 - h}" width="4" height="${h}" fill="${r}"/><rect x="${x}" y="${290 - h / 2 - 2}" width="${w + 12}" height="4" fill="${r}"/>`;
    });
    return `<svg viewBox="0 0 200 296" aria-hidden="true">${s}</svg>`;
  }
  document.getElementById('treeL').innerHTML = document.getElementById('treeR').innerHTML = tree();

  garland();
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(garland, 150); });

  // Soft white glowing snowfall (still for reduced-motion users).
  const cv = document.getElementById('snow'), c = cv.getContext('2d');
  const flakes = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), r: 1.3 + Math.random() * 3.2, v: 0.0007 + Math.random() * 0.002, p: Math.random() * 6 }));
  const size = () => { cv.width = innerWidth; cv.height = innerHeight; };
  addEventListener('resize', size); size();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    (function tick(ts) {
      c.clearRect(0, 0, cv.width, cv.height);
      c.shadowColor = 'rgba(255,255,255,.9)'; c.shadowBlur = 8; c.fillStyle = 'rgba(255,255,255,.92)';
      for (const s of flakes) {
        s.y += s.v; if (s.y > 1.03) { s.y = -0.03; s.x = Math.random(); }
        c.beginPath(); c.arc((s.x + Math.sin(ts / 2400 + s.p) * 0.015) * cv.width, s.y * cv.height, s.r, 0, 7); c.fill();
      }
      requestAnimationFrame(tick);
    })(0);
  }

})();
</script>
<script>
/* Christmas music: Boney M. and Michael Bublé playlists through the YouTube player (licensed by YouTube; nothing is hosted here). */
(() => {
  const LISTS = { bm: ['Boney M.', 'PLKtm2G15Yd1CfNtlpLfbcRACx0JY0ddRc'], mb: ['Michael Bublé', ['mBycW6iu8GM', 'l3l83C-we-k', 'fMAlTDQT_9k', 'pw3PhhSfcQg', '0bhsXykXxfg', '0yhI35F2NB0', 'oIKt5p3UmXg', 'Dkq3LD-4pmM', 'Mk6ZzzWWJ1A', 'xvHQO9LT6ZI', 'R8CBoVc_OMI']] }; // a playlist id, or a list of official video ids
  document.body.insertAdjacentHTML('beforeend', `<button id="more" class="alt" hidden>🎶 Christmas music</button>
    <div id="tunes">
      <div class="thead"><button class="alt on" data-k="bm">Boney M.</button><button class="alt" data-k="mb">Bublé</button><span class="tsp" id="tstat"></span>
        <button class="alt" id="tmute" title="Pause or play">⏸</button><button class="alt" id="tmin" title="Minimise">–</button><button class="alt" id="tclose" title="Close">×</button></div>
      <div id="tbody"><div id="ytp"></div></div>
    </div>`);
  const box = document.getElementById('tunes'), more = document.getElementById('more'), stat = document.getElementById('tstat'), muteBtn = document.getElementById('tmute'), minBtn = document.getElementById('tmin');
  let yt, cur = 'bm', paused = false;
  const tabs = (k) => box.querySelectorAll('[data-k]').forEach((b) => b.classList.toggle('on', b.dataset.k === k));
  const load = (k) => { cur = k; tabs(k); paused = false; muteBtn.textContent = '⏸'; const src = LISTS[k][1]; yt.loadPlaylist(Array.isArray(src) ? src : { listType: 'playlist', list: src }); yt.setShuffle(true); };
  window.onYouTubeIframeAPIReady = () => {
    yt = new YT.Player('ytp', { width: '100%', height: '169', playerVars: { listType: 'playlist', list: LISTS.bm[1], autoplay: 1, rel: 0, playsinline: 1 }, events: {
      onReady: (e) => { e.target.setShuffle(true); e.target.playVideo(); setTimeout(() => { if (e.target.getPlayerState() !== 1) stat.textContent = 'Tap anywhere to start'; }, 1500); },
      onAutoplayBlocked: () => { stat.textContent = 'Tap anywhere to start'; },
      onStateChange: (e) => {
        if (e.data === 1) stat.textContent = '';
        if (e.data === 0) { const l = yt.getPlaylist() || []; if (yt.getPlaylistIndex() >= l.length - 1) load(cur === 'bm' ? 'mb' : 'bm'); } // playlist finished: play the other artist
      } } });
  };
  // Browsers block sound until the first tap or key press: start the music then, but never override a pause the person chose.
  ['pointerdown', 'keydown', 'touchend', 'click'].forEach((g) => document.addEventListener(g, () => { if (yt && yt.getPlayerState && !paused && [-1, 5].includes(yt.getPlayerState())) yt.playVideo(); }, true));
  box.onclick = (e) => {
    const t = e.target;
    if (t.dataset.k) { load(t.dataset.k); box.classList.remove('min'); minBtn.textContent = '–'; }
    if (t.id === 'tmute') { paused ? (yt.playVideo(), paused = false, t.textContent = '⏸') : (yt.pauseVideo(), paused = true, t.textContent = '▶'); }
    if (t.id === 'tmin') { box.classList.toggle('min'); const m = box.classList.contains('min'); t.textContent = m ? '▴' : '–'; t.title = m ? 'Expand' : 'Minimise'; } // music keeps playing
    if (t.id === 'tclose') { yt.pauseVideo(); paused = true; box.hidden = true; more.hidden = false; }
  };
  more.onclick = () => { box.hidden = false; more.hidden = true; paused = false; muteBtn.textContent = '⏸'; yt.playVideo(); };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
})();
</script>
