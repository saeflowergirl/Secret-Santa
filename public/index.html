<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#b3202f;--deep:#8a1424;--green:#14573a;--gold:#e3bd6a;--cream:#fffaf0}
  *{box-sizing:border-box}
  html{overflow-x:hidden}
  body{font:17px system-ui,sans-serif;max-width:660px;margin:0 auto;padding:0 1rem 150px;color:#f6efe0;min-height:100vh;
    background:radial-gradient(ellipse at 50% -10%,#2a8a5c 0%,#14573a 38%,#0b3a27 70%,#06241a 100%) fixed}
  #app{position:relative;z-index:2}
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700}
  header{text-align:center;margin:7.2rem 0 1.4rem;position:relative;z-index:2}
  h1{font-size:3.8rem;line-height:1;margin:0;color:#fff8e6;text-shadow:0 2px 0 #7a1522,0 0 24px rgba(255,210,122,.5)}
  .kicker{color:var(--gold);letter-spacing:.35em;font-size:.75rem;text-transform:uppercase;margin-top:.7rem}
  .holly{display:inline-block;width:64px;vertical-align:middle;margin:0 .2rem}
  h2{font-size:1.8rem;color:#ffe9b0;border-bottom:1px solid var(--gold);padding-bottom:.2rem;margin-top:1.8rem}
  p{line-height:1.45}
  a{color:#ffd98a}
  textarea,input,select,button{font:inherit;padding:.6rem;margin:.3rem 0;border-radius:10px;border:1px solid var(--gold)}
  textarea,input,select{background:var(--cream);color:#2a2622}
  textarea,input.wide{width:100%}
  button,a.btn{background:linear-gradient(#cf2c3e,var(--deep));color:#fff;cursor:pointer;text-decoration:none;display:inline-block;padding:.6rem .95rem;border-radius:10px;border:1px solid var(--gold);box-shadow:0 2px 6px #0005}
  button.alt,a.alt{background:var(--cream);color:var(--deep);border:1px solid var(--gold)}
  button:disabled{opacity:.6}
  .card{display:flex;gap:.8rem;background:var(--cream);color:#2a2622;border-radius:12px;padding:.8rem;margin:.6rem 0;border:1px solid var(--gold);box-shadow:0 3px 10px #0004}
  .card img{width:80px;height:80px;object-fit:contain;flex:none}
  .card p{margin:.2rem 0;font-size:.88rem;color:#555}
  .card b{display:block}
  .card .muted{color:#666}
  .spin{font-family:'Cormorant Garamond',Georgia,serif;font-size:2.2rem;text-align:center;padding:1.5rem;background:var(--cream);color:var(--green);border-radius:14px;margin:1rem 0;border:2px solid var(--gold);box-shadow:0 4px 14px #0005}
  .spin button{font-family:system-ui,sans-serif;font-size:1rem}
  .over,.err{color:#ffb3ba;font-weight:600}
  .muted{color:rgba(255,255,255,.72);font-size:.85rem}
  table{width:100%;border-collapse:collapse} td{vertical-align:top;border-top:1px solid rgba(255,255,255,.2);padding:.6rem .3rem}
  dialog{background:var(--cream);color:#2a2622}
  dialog .muted{color:#666}
  /* decorations */
  #garland{position:absolute;top:0;left:0;right:0;height:120px;pointer-events:none;z-index:1}
  #garland svg{display:block;width:100%;height:120px}
  .tree{position:fixed;bottom:0;width:250px;pointer-events:none;z-index:1;filter:drop-shadow(0 0 18px rgba(255,220,140,.25))}
  .tree.l{left:6px} .tree.r{right:6px;transform:scaleX(-1)}
  .tw{animation:tw 2.6s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}
  #snow{position:fixed;inset:0;pointer-events:none;z-index:6}
  #music{position:fixed;top:12px;right:12px;z-index:10;border-radius:999px;font-size:.9rem}
  @media (max-width:980px){.tree{width:92px}h1{font-size:2.8rem}}
  @media (prefers-reduced-motion:reduce){.tw{animation:none}}
</style>
</head>
<body>
<div id="garland"></div>
<canvas id="snow"></canvas>
<div class="tree l" id="treeL"></div><div class="tree r" id="treeR"></div>
<button id="music" class="alt" aria-pressed="false">♪ Play carols</button>
<header><h1>Secret Santa</h1><div class="kicker"><svg class="holly" viewBox="0 0 64 40" aria-hidden="true"><g transform="translate(32 22)"><path d="M0 0C-6 -14 -24 -16 -30 -6C-24 -2 -26 4 -20 6C-16 10 -8 8 0 0Z" fill="#2a7a56" stroke="#0f3a28"/><path d="M0 0C6 -14 24 -16 30 -6C24 -2 26 4 20 6C16 10 8 8 0 0Z" fill="#3f9a70" stroke="#0f3a28"/><path d="M-26 -5L-2 -1M26 -5L2 -1" stroke="#0f3a28" stroke-width="1" fill="none"/><circle cx="-3" cy="2" r="5" fill="#d92b3d"/><circle cx="4" cy="3" r="5" fill="#b3202f"/><circle cx="0" cy="8" r="5" fill="#d92b3d"/><circle cx="-4.5" cy="0.5" r="1.3" fill="#ffd0d6"/><circle cx="2.5" cy="1.5" r="1.3" fill="#ffd0d6"/></g></svg> &nbsp;merry &amp; bright&nbsp; <svg class="holly" style="transform:scaleX(-1)" viewBox="0 0 64 40" aria-hidden="true"><g transform="translate(32 22)"><path d="M0 0C-6 -14 -24 -16 -30 -6C-24 -2 -26 4 -20 6C-16 10 -8 8 0 0Z" fill="#2a7a56" stroke="#0f3a28"/><path d="M0 0C6 -14 24 -16 30 -6C24 -2 26 4 20 6C16 10 8 8 0 0Z" fill="#3f9a70" stroke="#0f3a28"/><path d="M-26 -5L-2 -1M26 -5L2 -1" stroke="#0f3a28" stroke-width="1" fill="none"/><circle cx="-3" cy="2" r="5" fill="#d92b3d"/><circle cx="4" cy="3" r="5" fill="#b3202f"/><circle cx="0" cy="8" r="5" fill="#d92b3d"/><circle cx="-4.5" cy="0.5" r="1.3" fill="#ffd0d6"/><circle cx="2.5" cy="1.5" r="1.3" fill="#ffd0d6"/></g></svg></div></header>
<div id="app"></div>
<script>
const $ = (s) => document.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const [, role, token] = location.pathname.split('/');

async function api(a, data, qs = '') {
  const r = await fetch(`/api?a=${a}${qs}`, data ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) } : undefined);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}
const ITEMS = [];
const card = (i, extra = '') => `<div class="card">${i.image ? `<img src="${esc(i.image)}" referrerpolicy="no-referrer" alt="">` : ''}
  <div><b>${esc(i.title)}</b><p>${i.price ? 'R' + esc(i.price) : 'price not set'}</p><button data-view="${ITEMS.push(i) - 1}">View</button> ${extra}</div></div>`;

// Item popup: native <dialog>, filled on demand.
document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg" style="max-width:480px;border-radius:12px;border:0;padding:1.2rem"></dialog>');
document.addEventListener('click', (e) => {
  const dlg = $('#dlg');
  if (e.target.dataset.view != null) {
    const i = ITEMS[e.target.dataset.view];
    dlg.innerHTML = `${i.image ? `<img src="${esc(i.image)}" referrerpolicy="no-referrer" alt="" style="width:100%;max-height:260px;object-fit:contain">` : ''}
      <h3>${esc(i.title)}</h3><p>${esc(i.description) || '<span class="muted">No description available.</span>'}</p>
      <p><b>${i.price ? 'R' + esc(i.price) : 'Price not set'}</b></p>
      <a class="btn" href="${esc(i.url)}" target="_blank" rel="noopener">Go to shop</a> <button class="alt" data-close>Close</button>`;
    dlg.showModal();
  } else if (e.target.dataset.close != null || e.target === dlg) dlg.close();
});

/* ---------- home: host creates the game ---------- */
function home() {
  const games = JSON.parse(localStorage.games || '[]');
  app.innerHTML = `${games.length ? `<h2>Your games</h2>${games.map((g) => `<p><a href="/h/${esc(g.host)}">${esc(g.title)}</a></p>`).join('')}<h2>Start a new game</h2>` : ''}
    <p>Group name (for example "Sarah's family"):</p>
    <input class="wide" id="title" placeholder="Sarah's family">
    <p>You're the host. Enter everyone taking part, one name per line:</p>
    <textarea id="names" rows="7" placeholder="Kurt&#10;Sarah&#10;Pixie Roo&#10;Bear&#10;Furgus&#10;Jake"></textarea>
    <p>Couples who must not draw each other, one pair per line, like <b>Kurt + Sarah</b>:</p>
    <textarea id="couples" rows="4" placeholder="Kurt + Sarah&#10;Pixie Roo + Bear&#10;Furgus + Jake"></textarea>
    <button id="go">Create game and draw</button> <span class="err" id="err"></span>`;
  $('#go').onclick = async () => {
    const lines = (id) => $(id).value.split('\n').map((s) => s.trim()).filter(Boolean);
    try {
      const r = await api('create', { title: $('#title').value, names: lines('#names'), couples: lines('#couples').map((l) => l.split(/\s*[+&]\s*/)) });
      location.href = '/h/' + r.host;
    } catch (e) { $('#err').textContent = e.message; }
  };
}

/* ---------- host master view ---------- */
async function host() {
  const { title, players, budget } = await api('host', null, '&t=' + token);
  const origin = location.origin;
  const games = JSON.parse(localStorage.games || '[]').filter((g) => g.host !== token);
  localStorage.games = JSON.stringify([...games, { title, host: token }]);
  app.innerHTML = `<p><a href="/">All my games</a></p><h2>${esc(title)}</h2><p>Master view. Bookmark this page and keep it private. Send each person their own link (don't open them yourself if you want to stay surprised).</p>
    <table>${players.map((p) => `<tr><td><b>${esc(p.name)}</b><br><span class="muted">${p.revealed ? 'has spun' : 'not spun yet'}</span><br>
      <button class="alt" data-link="${esc(origin + '/p/' + p.token)}">Copy link</button></td>
      <td><button class="alt" data-reveal>Reveal</button>
        <div hidden>gives to <b>${esc(p.gives)}</b><br>${p.items.length ? p.items.map((i) => `<div class="muted"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a> ${i.price ? 'R' + esc(i.price) : ''}</div>`).join('') : '<span class="muted">no wish list yet</span>'}</div></td></tr>`).join('')}</table>
    <p class="muted">Budget R${budget} each. Wish lists update when you refresh.</p>
    <h2>Add someone</h2>
    <input id="newname" placeholder="Name"> <select id="partner"><option value="">No partner in group</option>${players.map((p) => `<option>${esc(p.name)}</option>`).join('')}</select>
    <button id="addp">Add</button> <span class="err" id="err"></span>
    <h2>Start over</h2>
    <button class="alt" id="redraw">Redraw everyone</button> <span class="muted">New draw, everyone spins again. Wish lists are kept.</span>`;
  const act = async (a, data) => { try { await api(a, { t: token, ...data }); host(); } catch (x) { $('#err').textContent = x.message; } };
  $('#addp').onclick = () => act('add', { name: $('#newname').value, partner: $('#partner').value });
  $('#redraw').onclick = () => confirm('Redraw everyone? Anyone who already spun will have a new person.') && act('redraw');
  app.onclick = (e) => {
    if (e.target.dataset.reveal != null) { const d = e.target.nextElementSibling; d.hidden = !d.hidden; e.target.textContent = d.hidden ? 'Reveal' : 'Hide'; }
    const l = e.target.dataset.link; if (l) navigator.clipboard.writeText(l).then(() => (e.target.textContent = 'Copied!')); };
}

/* ---------- player view ---------- */
async function player() {
  let me = await api('me', null, '&t=' + token);
  const total = () => me.items.reduce((s, i) => s + (Number(i.price) || 0), 0);
  const save = () => api('items', { t: token, items: me.items });

  function render() {
    const t = total();
    ITEMS.length = 0;
    app.innerHTML = `<p>Hi <b>${esc(me.name)}</b>! <span class="muted">${esc(me.title)}</span></p>
      <div id="spin"></div>
      <h2>Your wish list</h2>
      <p class="muted">Pick up to ${me.maxItems} things worth about R${me.budget} in total (a little over or under is fine). Find them, then paste the product link here.</p>
      <a class="btn alt" href="https://www.takealot.com" target="_blank" rel="noopener">Browse takealot.com</a>
      <a class="btn alt" href="https://www.amazon.co.za" target="_blank" rel="noopener">Browse amazon.co.za</a>
      <a class="btn alt" href="https://www.temu.com" target="_blank" rel="noopener">Browse temu.com</a>
      <p class="muted">Temu ships slowly, so only pick from Temu if you add your list at least a month before the gift swap.</p>
      <div><input class="wide" id="url" placeholder="Paste a takealot, amazon or temu product link"> <button id="add">Add item</button> <span class="err" id="err"></span></div>
      ${me.items.map((i, n) => card(i, `<label class="muted">Price in Rand <input type="number" min="0" style="width:6rem" value="${esc(i.price || '')}" data-price="${n}"></label>
        <button class="alt" data-rm="${n}">Remove</button>`)).join('')}
      <p>Total: <span class="${t > me.budget * 1.2 ? 'over' : ''}">R${t}</span> of R${me.budget}</p>
      <div id="target"></div>`;
    renderSpin();
    if (me.revealed) renderTarget();
  }

  function renderSpin() {
    $('#spin').innerHTML = me.revealed
      ? `<div class="spin">You are Secret Santa for<br><b>🎁 ${esc(me.target.name)}</b></div>`
      : `<div class="spin" id="wheel">Ready to find out who you got?<br><button id="spinbtn">🎲 Spin!</button></div>`;
    const b = $('#spinbtn');
    if (!b) return;
    b.onclick = async () => {
      b.disabled = true;
      const r = await api('reveal', { t: token });
      const w = $('#wheel'); let k = 0;
      const timer = setInterval(() => { w.textContent = me.names[k++ % me.names.length]; }, 90);
      setTimeout(() => { clearInterval(timer); me = r; render(); }, 3000);
    };
  }

  function renderTarget() {
    $('#target').innerHTML = `<h2>Gift ideas from ${esc(me.target.name)}</h2>` +
      (me.target.items.length ? me.target.items.map((i) => card(i)).join('') : '<p class="muted">They have not picked anything yet. Check back later (refresh the page).</p>');
  }

  app.onclick = async (e) => {
    const d = e.target.dataset;
    if (d.rm != null) { me.items.splice(d.rm, 1); await save(); render(); }
    if (e.target.id === 'add') {
      $('#err').textContent = '';
      if (me.items.length >= me.maxItems) return ($('#err').textContent = `Max ${me.maxItems} items`);
      e.target.disabled = true; e.target.textContent = 'Loading...';
      try { me.items.push(await api('preview', null, `&t=${token}&url=${encodeURIComponent($('#url').value.trim())}`)); await save(); render(); }
      catch (x) { $('#err').textContent = x.message; e.target.disabled = false; e.target.textContent = 'Add item'; }
    }
  };
  app.onchange = async (e) => {
    if (e.target.dataset.price != null) { me.items[e.target.dataset.price].price = Number(e.target.value) || 0; await save(); render(); }
  };
  render();
}

(role === 'h' ? host() : role === 'p' ? player() : Promise.resolve(home())).catch((e) => (app.innerHTML = `<p class="err">${esc(e.message)}</p>`));
</script>
<script>
/* ---- Decorations: garland, trees, holly, snow, music box carols (same on every page) ---- */
(() => {
  const f = (n) => n.toFixed(1);
  const mk = (s0) => { let s = s0; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
  const LIGHTS = ['#fff6d6', '#ff7a7a', '#ffd27a', '#a8f0b4', '#ffffff'];
  const BAUBLES = [['#e8c86a', '#9a7424'], ['#d92b3d', '#7a0f1c'], ['#f4f4f4', '#aab4bd'], ['#c9a24a', '#8a6420']];

  // Pine garland across the top, sized to the window so it never crowds the title.
  function garland() {
    const rnd = mk(7), W = innerWidth, swags = Math.max(3, Math.round(W / 210)), sw = W / swags;
    let g = '', lights = '', top = '';
    for (let k = 0; k < swags; k++) {
      const x0 = k * sw, cx = x0 + sw / 2, x1 = x0 + sw;
      const pt = (t) => [(1 - t) ** 2 * x0 + 2 * (1 - t) * t * cx + t * t * x1, (1 - t) ** 2 * 8 + 2 * (1 - t) * t * 104 + t * t * 8];
      for (let t = 0; t <= 1; t += 6 / sw) {
        const [x, y] = pt(t);
        for (let n = 0; n < 4; n++) {
          const a = (rnd() * 150 + 15) * Math.PI / 180, l = 9 + rnd() * 12, d = rnd() < 0.5 ? -1 : 1;
          g += `<line x1="${f(x)}" y1="${f(y)}" x2="${f(x + Math.cos(a) * l * d)}" y2="${f(y + Math.sin(a) * l)}" stroke="${['#0f3a28', '#1b5b40', '#2a7a56', '#3f9a70'][n]}" stroke-width="2.6" stroke-linecap="round"/>`;
        }
        if (rnd() < 0.07) for (let b = 0; b < 3; b++) g += `<circle cx="${f(x + b * 5 - 5)}" cy="${f(y + 8 + (b % 2) * 4)}" r="3.4" fill="#d92b3d"/><circle cx="${f(x + b * 5 - 5.8)}" cy="${f(y + 7)}" r="1" fill="#ffd0d6"/>`;
      }
      for (let t = 0.06; t < 1; t += 0.09) {
        const [x, y] = pt(t), c = LIGHTS[Math.floor(rnd() * LIGHTS.length)];
        lights += `<g class="tw" style="animation-delay:${f(rnd() * 3)}s"><circle cx="${f(x)}" cy="${f(y + 10)}" r="10" fill="${c}" opacity=".3"/><circle cx="${f(x)}" cy="${f(y + 10)}" r="3.2" fill="${c}"/></g>`;
      }
    }
    for (let k = 0; k <= swags; k++) {
      const x = k * sw, y = 40 + (k % 2) * 14, [hi, lo] = BAUBLES[k % BAUBLES.length];
      top += `<line x1="${f(x)}" y1="8" x2="${f(x)}" y2="${y - 13}" stroke="#c9a24a" stroke-width="1.2"/><rect x="${f(x - 3.5)}" y="${y - 16}" width="7" height="5" rx="1" fill="#e3bd6a"/>
        <circle cx="${f(x)}" cy="${y}" r="13" fill="${lo}"/><circle cx="${f(x - 1.5)}" cy="${f(y - 1.5)}" r="11.5" fill="${hi}"/><ellipse cx="${f(x - 4.5)}" cy="${f(y - 5.5)}" rx="3.5" ry="2" fill="#fff" opacity=".6" transform="rotate(-35 ${f(x - 4.5)} ${f(y - 5.5)})"/>`;
    }
    document.getElementById('garland').innerHTML = `<svg viewBox="0 0 ${f(W)} 120" aria-hidden="true">${g}${lights}${top}</svg>`;
  }

  // A decorated Christmas tree with gold star, baubles, lights, tinsel and presents.
  function tree() {
    const rnd = mk(42);
    const tiers = [[20, 112, 52], [68, 172, 70], [118, 240, 88]]; // [apexY, baseY, half-width]
    let s = '<defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3fa06f"/><stop offset="1" stop-color="#0f4a30"/></linearGradient><radialGradient id="sg"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient></defs>';
    s += '<rect x="88" y="236" width="24" height="26" fill="#6b4226"/>';
    tiers.forEach(([a, b, hw]) => { s += `<path d="M100 ${a} L${100 + hw} ${b} Q100 ${b + 14} ${100 - hw} ${b} Z" fill="url(#tg)" stroke="#0b3a27" stroke-width="1.5"/>`; });
    tiers.forEach(([a, b, hw]) => { const y = b - 16; s += `<path d="M${100 - hw * 0.8} ${y} Q100 ${y + 26} ${100 + hw * 0.8} ${y}" fill="none" stroke="#e3bd6a" stroke-width="2.4" stroke-dasharray="1 5" stroke-linecap="round"/>`; });
    for (let i = 0; i < 26; i++) {
      const [a, b, hw] = tiers[Math.floor(rnd() * 3)], y = a + 24 + rnd() * (b - a - 34), w = hw * (y - a) / (b - a) * 0.82, x = 100 + (rnd() * 2 - 1) * w;
      if (i % 3 === 0) { const c = LIGHTS[Math.floor(rnd() * LIGHTS.length)]; s += `<g class="tw" style="animation-delay:${f(rnd() * 3)}s"><circle cx="${f(x)}" cy="${f(y)}" r="7" fill="${c}" opacity=".35"/><circle cx="${f(x)}" cy="${f(y)}" r="2.6" fill="${c}"/></g>`; }
      else { const [hi, lo] = BAUBLES[Math.floor(rnd() * BAUBLES.length)]; s += `<circle cx="${f(x)}" cy="${f(y)}" r="6.2" fill="${lo}"/><circle cx="${f(x - 0.6)}" cy="${f(y - 0.6)}" r="5.4" fill="${hi}"/><circle cx="${f(x - 2)}" cy="${f(y - 2.2)}" r="1.4" fill="#fff" opacity=".7"/>`; }
    }
    const star = [...Array(10)].map((_, i) => { const r = i % 2 ? 6 : 14, t = i * Math.PI / 5 - Math.PI / 2; return f(100 + r * Math.cos(t)) + ',' + f(18 + r * Math.sin(t)); }).join(' ');
    s += `<g class="tw"><circle cx="100" cy="18" r="30" fill="url(#sg)"/></g><polygon points="${star}" fill="#ffd24a" stroke="#c9961f" stroke-width="1"/>`;
    [[34, 12, '#b3202f', '#e3bd6a'], [62, 18, '#f4f4f4', '#b3202f'], [118, 14, '#e3bd6a', '#14573a'], [140, 10, '#b3202f', '#f4f4f4']].forEach(([x, w, c, r], i) => {
      const h = w + (i % 2) * 4;
      s += `<rect x="${x}" y="${290 - h}" width="${w + 12}" height="${h}" fill="${c}" stroke="#0004"/><rect x="${x + (w + 12) / 2 - 2}" y="${290 - h}" width="4" height="${h}" fill="${r}"/><rect x="${x}" y="${290 - h / 2 - 2}" width="${w + 12}" height="4" fill="${r}"/>`;
    });
    return `<svg viewBox="0 0 200 296" aria-hidden="true">${s}</svg>`;
  }
  document.getElementById('treeL').innerHTML = document.getElementById('treeR').innerHTML = tree();

  garland();
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(garland, 150); });

  // Soft white glowing snowfall (still for reduced-motion users).
  const cv = document.getElementById('snow'), c = cv.getContext('2d');

  const mkBus = () => {
    const len = ctx.sampleRate * 2.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);

  const PARTIALS = [[1, 1, 1.5], [2, 0.34, 1.0], [3, 0.14, 0.6], [5.4, 0.06, 0.2]]; // [ratio, level, decay seconds]
  const bell = (fr, t, d, gain, ring = 1) => PARTIALS.forEach(([m, lv, dec]) => {
    const o = ctx.createOscillator(), v = ctx.createGain(), len = dec * ring * (0.8 + Math.min(d, 2) * 0.45);

    v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(gain * lv, t + 0.005); v.gain.exponentialRampToValueAtTime(0.0001, t + len);

  const next = () => {
    const [title, melody, chords, spb] = TUNES[i++ % TUNES.length];
    const t0 = ctx.currentTime + 0.3;
    let t = t0;
    for (const s of melody.split(' ').filter(Boolean)) {
      const [n, b] = s.split(':');
      if (n !== 'R') bell(N[n], t + (Math.random() - 0.5) * 0.012, b * spb, 0.5);
      t += b * spb;
    }
    let c = t0;
    for (const [r, beats, minor] of chords) {
      const pattern = minor ? ARPM : ARP;
      bell(CH[r], c, beats * spb, 0.5, 2.2); // bass, rings long
      for (let k = 1; k < beats; k++) bell(CH[r] * 2 * pattern[k % 4], c + k * spb, spb, 0.16); // soft rolling chord
      c += beats * spb;

    timer = setTimeout(next, (t - ctx.currentTime + 2.5) * 1000);

  const btn = document.getElementById('music');
  // Autoplay: on by default. Browsers only allow sound after a first tap/key, so if it is blocked
  // we wait for the first interaction anywhere on the page. Muting is remembered across pages.
  let started = false, startedAt = 0;
  const begin = () => {
    if (!ctx || started) return;
    ctx.resume().then(() => { if (ctx && ctx.state === 'running' && !started) { started = true; startedAt = Date.now(); next(); } });
  };
  const gestures = ['pointerdown', 'keydown', 'touchstart'];
  const onGesture = () => { if (ctx) begin(); };
